[package]
name = "lxir"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Loxone config model: lossless .Loxone XML core, UUID/identity model, lockfile, IR compile/decompile, semantic diff"
repository = "https://github.com/discostu105/lxir"
# Dual-licensed: recipient chooses GPL-3.0 or a commercial license (see LICENSE).
license = "GPL-3.0-or-later OR LicenseRef-Commercial"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
